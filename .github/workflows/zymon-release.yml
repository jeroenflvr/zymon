name: zymon-client

# Pull requests: fmt, clippy, tests and a build of every target.
# Pushes to main and tags v*: the same, then publish a GitHub release v<workspace version> with the flat assets
# install.sh downloads (zymon-client-<label> + SHA256SUMS). A tag push IS the version: the build stamps it into the
# binary, no Cargo.toml edit needed (git tag v0.1.3 && git push origin v0.1.3). A push to main publishes
# v<Cargo.toml version> only if that release does not exist yet.
on:
  push:
    branches: [main]
    paths: ['zymon/**', '.github/workflows/zymon-release.yml']
    tags: ['v*']
  pull_request:
    paths: ['zymon/**', '.github/workflows/zymon-release.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: zymon

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zymon
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build-linux:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: arm-unknown-linux-musleabihf, label: linux-armv6 }
          - { target: armv7-unknown-linux-musleabihf, label: linux-armv7 }
          - { target: aarch64-unknown-linux-musl, label: linux-aarch64 }
          - { target: x86_64-unknown-linux-musl, label: linux-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i.bak -E "s/^version = \"[^\"]*\"/version = \"$v\"/" Cargo.toml
          sed -i.bak -E "/^name = \"zymon-(core|client)\"/{n;s/^version = .*/version = \"$v\"/;}" Cargo.lock
          grep -n '^version' Cargo.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zymon
          key: ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild
        run: |
          pip install --user ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: rustup target add ${{ matrix.target }}
      - run: cargo zigbuild --release --locked -p zymon-client --target ${{ matrix.target }}
      - name: Stage and verify the binary
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/zymon-client out/zymon-client-${{ matrix.label }}
          file out/zymon-client-${{ matrix.label }}
          file out/zymon-client-${{ matrix.label }} | grep -q 'statically linked'
      - uses: actions/upload-artifact@v4
        with:
          name: zymon-client-${{ matrix.label }}
          path: zymon/out/zymon-client-${{ matrix.label }}
          if-no-files-found: error

  build-macos:
    needs: check
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i.bak -E "s/^version = \"[^\"]*\"/version = \"$v\"/" Cargo.toml
          sed -i.bak -E "/^name = \"zymon-(core|client)\"/{n;s/^version = .*/version = \"$v\"/;}" Cargo.lock
          grep -n '^version' Cargo.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zymon
      - run: rustup target add aarch64-apple-darwin
      - run: cargo build --release --locked -p zymon-client --target aarch64-apple-darwin
      - name: Test on macOS (native sections, legacy-format acceptance checks)
        run: cargo test --workspace --locked
      - name: Stage the binary
        run: |
          mkdir -p out
          cp target/aarch64-apple-darwin/release/zymon-client out/zymon-client-darwin-arm64
          file out/zymon-client-darwin-arm64
          out/zymon-client-darwin-arm64 version
      - uses: actions/upload-artifact@v4
        with:
          name: zymon-client-darwin-arm64
          path: zymon/out/zymon-client-darwin-arm64
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release tag
        id: ver
        run: |
          # A tag push is the version (the build jobs stamped it into the binary); a push to main uses Cargo.toml.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: zymon-client-*
          merge-multiple: true
          path: zymon/release
      - name: Checksums
        working-directory: zymon/release
        run: |
          chmod +x zymon-client-*
          sha256sum zymon-client-* > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 4 ]
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            # main publishes a version once; later pushes with the same version are skipped (bump Cargo.toml or tag)
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists: not replacing it. Bump the version in zymon/Cargo.toml or push a new tag."
              exit 0
            fi
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "zymon-client $TAG" \
              --notes "Build of $GITHUB_SHA from main."
          elif gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "zymon-client $TAG" --generate-notes
          fi
